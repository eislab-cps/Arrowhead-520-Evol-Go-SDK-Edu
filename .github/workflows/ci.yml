name: ci
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Tier 1 — vet
        run: go vet ./...
      - name: Tier 2 — unit tests
        run: go test ./...
